# Configuración para Netlify (usado como fallback, despliegue principal en Vercel)
[build]
  publish = "dist"
  command = "npm run build"

# Proxy API - debe ir PRIMERO (más específico)
[[redirects]]
  from = "/api/*"
  to = "https://api.tecnogafas.com.ar/:splat"
  status = 200
  force = true

# Excluir archivos estáticos del redirect SPA
[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/icon-*"
  to = "/icon-512.png"
  status = 200

# SPA catch-all - debe ir al FINAL
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para proxy API (CORS)
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Authorization, Content-Type, Accept"

# Headers para archivos específicos
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
