name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs (Debug & Release)
    runs-on: ubuntu-latest

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      # 📥 Código
      - name: Checkout source
        uses: actions/checkout@v4

      # 🟢 Node (Forzamos la versión 22 para Capacitor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ☕ Java + Gradle cache
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 📦 Dependencias
      - name: Install dependencies
        run: npm ci

      # 🏗️ Build Web App (Necesario antes del sync)
      - name: Build Web App
        run: npm run build

      # 🔄 Reconstrucción Forzada de Capacitor
      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      # 🎨 Assets Capacitor
      - name: Generate Native Assets
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon.png || true
          npx @capacitor/assets generate --android

      # 🆙 Update Version
      - name: Bump Version Code
        working-directory: ./android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle

      # 🛠️ Build Debug
      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 📦 Subir APK Debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 🔐 Crear keystore desde secrets
      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # 🚀 Build Release
      - name: Build Release APK & AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      # 📦 Subir Release
      - name: Upload Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
