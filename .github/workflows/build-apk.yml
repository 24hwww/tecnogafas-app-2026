name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs (Debug & Release)
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      # 📥 Código
      - name: Checkout source
        uses: actions/checkout@v4

      # 🟢 Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ☕ Java + Gradle cache
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ⚡ Cache adicional Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 📦 Dependencias
      - name: Install dependencies
        run: npm ci

      # 📦 Cache Assets
      - name: Cache generated assets
        uses: actions/cache@v4
        id: assets-cache
        with:
          path: |
            public/
            assets/
          key: assets-${{ hashFiles('download-images.js') }}

      - name: Download assets if needed
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: node download-images.js

      # 🏗️ Build Vite
      - name: Build Web App
        run: npm run build

      # 🎨 Assets Capacitor
      - name: Generate Native Assets
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon.png || true
          npx @capacitor/assets generate --android

      # 🔄 Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 🆙 Update Version
      - name: Bump Version Code
        working-directory: ./android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle

      # 🛠️ Build Debug Error
      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 📦 Subir APK Debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 🔐 Crear keystore desde secrets (condicional)
      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # 🚀 Build firmado (condicional)
      - name: Build Release APK & AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      # 📦 Subir APK firmado (condicional)
      - name: Upload Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 📦 Subir AAB firmado (Play Store) (condicional)
      - name: Upload AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
