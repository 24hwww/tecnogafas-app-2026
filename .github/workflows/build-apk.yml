name: Build Android APK (Signed)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 📥 Código
      - name: Checkout source
        uses: actions/checkout@v4

      # 🟢 Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ☕ Java + Gradle cache
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ⚡ Cache adicional Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 📦 Dependencias
      - name: Install dependencies
        run: npm ci

      # 🏗️ Build Vite
      - name: Build Web App
        run: npm run build

      # 🎨 Assets Capacitor
      - name: Generate Native Assets
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon.png || true
          npx @capacitor/assets generate --android

      # 🔄 Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 🔐 Crear keystore desde secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # 🚀 Build firmado
      - name: Build Release APK & AAB
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      # 📦 Subir APK firmado
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 📦 Subir AAB firmado (Play Store)
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tecnogafas-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
